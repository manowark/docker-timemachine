name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"   # кожні 6 годин
  workflow_dispatch:         # кнопка "Run workflow" вручну

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git remote add upstream https://github.com/mbentley/docker-timemachine.git
          git fetch upstream
          git checkout main
          # reset до upstream: у форку ви ніколи не мите своїх комітів — так найпростіше і надійніше
          git reset --hard upstream/main
          git push --force origin main
