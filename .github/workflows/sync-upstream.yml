name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}   # див. примітку нижче

      - name: Sync
        run: |
          git remote add upstream https://github.com/mbentley/docker-timemachine.git
          git fetch upstream
          git reset --hard upstream/master
          git push --force origin HEAD
