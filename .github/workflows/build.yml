name: Build armv7 image

on:
  schedule:
    - cron: "0 3 * * *"        # щодня о 03:00 UTC (= 05:00 за Києвом)
  push:
    branches: [master]
  workflow_run:
    workflows: ["Sync with upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # дата збірки в UTC — саме так mbentley формує свої теги
      - name: Build date tag
        id: date
        run: echo "date=$(TZ=UTC date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.smb
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timemachine:latest
            ghcr.io/${{ github.repository_owner }}/timemachine:smb
            ghcr.io/${{ github.repository_owner }}/timemachine:smb-${{ steps.date.outputs.date }}
