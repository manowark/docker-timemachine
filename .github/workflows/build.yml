name: Build armv7 image

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sync with upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect version tag (from latest upstream release)
        id: ver
        run: |
          VER=$(curl -s https://api.github.com/repos/mbentley/docker-timemachine/releases/latest | jq -r .tag_name)
          echo "tag=${VER:-latest}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.smb
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timemachine:latest-armv7
            ghcr.io/${{ github.repository_owner }}/timemachine:smb-${{ steps.ver.outputs.tag }}-armv7
