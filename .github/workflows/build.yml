name: Build armv7 image

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Sync with upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upstream version tag
        id: ver
        run: |
          VER=$(curl -s https://api.github.com/repos/mbentley/docker-timemachine/releases/latest \
            | jq -r '.tag_name // empty')
          echo "tag=${VER:-latest}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.smb
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timemachine:latest-armv7
            ghcr.io/${{ github.repository_owner }}/timemachine:smb-${{ steps.ver.outputs.tag }}-armv7
